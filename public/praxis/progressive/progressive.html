<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var C=62.83*(27);
var app=document.getElementById('app');
var KEY='progressive-drills-v1';
var store=load();

function fresh(){
return{
solved:{},
revealed:{}
};
}
function load(){
try{
var r=localStorage.getItem(KEY);
if(r){
var p=JSON.parse(r);
return p||fresh();
}
}catch(e){}
return fresh();
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}
}
function sc(ch,i){
var k=ch+':'+i;
return store.solved[k]||false;
}
function rc(ch,i){
var k=ch+':'+i;
return store.revealed[k]||false;
}
function cl(ch,i){
return sc(ch,i)||rc(ch,i);
}
function solve(ch,i){
store.solved[ch+':'+i]=true;
save();
}
function reveal(ch,i){
store.revealed[ch+':'+i]=true;
save();
}
function chCleared(ch,levels){
var n=0;
for(var i=0;i<levels.length;i++) if(cl(ch,i)) n++;
return n;
}
function totalCleared(){
var n=0;
CHAPTERS.forEach(function(ch){
n+=chCleared(ch.key,ch.levels);
});
return n;
}
function totalLevels(){
var n=0;
CHAPTERS.forEach(function(ch){n+=ch.levels.length;});
return n;
}
function nextUncleared(){
for(var ci=0;ci<CHAPTERS.length;ci++){
var ch=CHAPTERS[ci];
if(chCleared(ch.key,ch.levels)<ch.levels.length) return ci;
}
return 0;
}

var CHAPTERS=[
{
key:'ch1',num:'01',acc:'acc-teal',
title:'Predict the Output',
tagline:'warm-up \u00b7 6 drills',
desc:'Start at the very beginning: one var, one print, then a small new twist each level. Type what you think the program prints \u2014 one line per print.',
lede:'Six short programs, each adding one small twist. You are the interpreter: read, predict, type the printed lines \u2014 one per row.',
diff:'\u25cf\u25cb\u25cb',
levels:[
{
title:'Read the Code',tag:'warm-up',
prompt:'What does this program print?',
code:'def main():\n    var num = 1\n    print(num)',
hint:'The value stored on the line above is all <code>print</code> writes out.',
expected:['1'],
solutionCode:'def main():\n    var num = 1\n    print(num)   # 1',
explain:'The variable <code>num</code> holds the value <code>1</code>. One variable, one read \u2014 nothing hidden yet.'
},
{
title:'Enter the Block',tag:'block scope',
prompt:'What does this program print?',
code:'def main():\n    var num = 1\n\n    if num == 1:\n        print(num)',
hint:'First decide: is the condition true or false?',
expected:['1'],
solutionCode:'def main():\n    var num = 1\n\n    if num == 1:      # true\n        print(num)    # 1',
explain:'The condition <code>num == 1</code> is true, so the block executes. Entering a block changes nothing by itself \u2014 the same outer <code>num</code> is printed.'
},
{
title:'Shadowing Begins',tag:'shadowing',
prompt:'Predict all three lines, in order.',
code:'def main():\n    var num = 1\n\n    if num == 1:\n        print(num)\n\n        var num = 2\n        print(num)\n\n    print(num)',
hint:'The first print runs before the inner <code>var num = 2</code> exists. The last print runs after the block has ended.',
expected:['1','2','1'],
solutionCode:'def main():\n    var num = 1\n\n    if num == 1:\n        print(num)      # 1  (outer num)\n        var num = 2     # NEW inner num\n        print(num)      # 2  (inner num)\n\n    print(num)          # 1  (inner num is gone)',
explain:'The first <code>print</code> reads the outer <code>num</code>. <code>var num = 2</code> declares a <i>new</i> variable inside the block that hides the outer one. When the block ends the inner <code>num</code> dies, and the outer <code>num</code> \u2014 still <code>1</code> \u2014 is visible again.'
},
{
title:'Shadow One, Update Another',tag:'scope tracing',
prompt:'The central example. Predict all four output lines.',
code:'def lexical_scopes():\n    var num = 1\n    var dig = 1\n\n    if num == 1:\n        print("num:", num)\n\n        var num = 2\n        print("num:", num)\n\n        dig = 2\n\n    print("num:", num)\n    print("dig:", dig)',
hint:'Inside the block, <code>num</code> is re-declared with <code>var</code>, but <code>dig</code> is only assigned.',
expected:['num: 1','num: 2','num: 1','dig: 2'],
solutionCode:'def lexical_scopes():\n    var num = 1\n    var dig = 1\n\n    if num == 1:\n        print("num:", num)   # num: 1\n        var num = 2          # NEW inner num\n        print("num:", num)   # num: 2\n        dig = 2              # updates outer dig\n\n    print("num:", num)       # num: 1\n    print("dig:", dig)       # dig: 2',
explain:'Two behaviours side by side: <code>num</code> is <b>shadowed</b> \u2014 a new inner variable that dies with the block, leaving the outer <code>num</code> untouched at <code>1</code>. <code>dig</code> has no inner declaration, so <code>dig = 2</code> <b>updates</b> the outer binding, and the change survives.'
},
{
title:'Nested Scope Trace',tag:'nested blocks',
prompt:'Determine the value printed at every point, A through D.',
code:'def main():\n    var x = 10\n\n    if x == 10:\n        print("A:", x)\n\n        var x = 20\n\n        if x == 20:\n            print("B:", x)\n\n        print("C:", x)\n\n    print("D:", x)',
hint:'The inner <code>x</code> is visible inside its defining block, including the nested <code>if</code>.',
expected:['A: 10','B: 20','C: 20','D: 10'],
solutionCode:'def main():\n    var x = 10\n\n    if x == 10:\n        print("A:", x)     # A: 10\n        var x = 20\n\n        if x == 20:\n            print("B:", x) # B: 20\n\n        print("C:", x)     # C: 20\n\n    print("D:", x)         # D: 10',
explain:'The inner <code>x</code> is visible inside its defining block, including the nested <code>if</code> \u2014 so both <b>B</b> and <b>C</b> read <code>20</code>. Once the outer block finishes, the original <code>x</code> becomes visible again: <b>D</b> reads <code>10</code>.'
},
{
title:'Expert Challenge',tag:'modification',type:'choice',
prompt:'Modify the program so it prints exactly: <code>num: 1, num: 2, num: 2, dig: 3</code>. Which change does it?',
code:'def lexical_scopes():\n    var num = 1\n    var dig = 1\n\n    if num == 1:\n        print("num:", num)\n\n        var num = 2\n        print("num:", num)\n\n        dig = 2\n\n    print("num:", num)\n    print("dig:", dig)',
options:[
'Change <code>dig = 2</code> to <code>dig = 3</code> \u2014 nothing else.',
'Remove <code>var</code> from <code>var num = 2</code>, and change <code>dig = 2</code> to <code>dig = 3</code>.',
'Remove <code>var</code> from <code>var num = 2</code> \u2014 nothing else.',
'Replace <code>dig = 2</code> with <code>var dig = 3</code> inside the block.'
],

h+='<a class="btn btn-primary" href="#/ch/'+(nextIdx+1)+'">'+ctaLabel+' \u2192</a>';
h+='</div>';
h+='</div>';

if(tC>=tL){
h+='<div class="course-done"><h3>All twenty-five drills cleared</h3><p>The shadow holds no secrets. Reset any chapter to run it again.</p></div>';
}

h+='<div class="rule-card">';
h+='<div class="rc-label">The One Rule</div>';
h+='<p><code>var</code> declares a variable in the <b>current block</b>. Redeclare a name that already exists outside, and the inner one <em>shadows</em> it \u2014 hiding the outer variable until the block ends, then dying quietly. A plain assignment (no <code>var</code>) writes to the <b>nearest</b> variable in scope. That is the entire game.</p>';
h+='</div>';

h+='<div class="chapters-head"><h2>Four chapters, twenty-five drills</h2></div>';
h+='<div class="chapters-grid">';
CHAPTERS.forEach(function(ch){
var cleared=chCleared(ch.key,ch.levels);
var total=ch.levels.length;
var pct=total>0?Math.round(cleared/total*100):0;
var statusText=cleared===0?'not started':cleared===total?'cleared \u2713':cleared+'/'+total+' cleared';
h+='<a class="ch-card '+ch.acc+'" href="#/ch/'+(CHAPTERS.indexOf(ch)+1)+'">';
h+='<div class="ch-kicker">Chapter '+ch.num+'</div>';
h+='<div class="ch-index">'+ch.num+'</div>';
h+='<div class="ch-title">'+ch.title+'</div>';
h+='<div class="ch-desc">'+ch.desc+'</div>';
h+='<div class="ch-meta">';
h+='<span>'+total+' levels</span><span>'+ch.diff+'</span>';
h+='<div class="ch-bar"><div class="ch-fill" style="width:'+pct+'%"></div></div>';
h+='<span class="ch-status">'+statusText+'</span>';
h+='</div>';
h+='</a>';
});
h+='</div>';

h+='<div class="home-footer">';
h+='<p>Progress saved locally in your browser. No server, no tracking.</p>';
h+='<p><a class="back-link" href="prog_01_moves.html">Browse the 13 Progressive Praxis drills \u2192</a></p>';
h+='<div style="max-width:760px;margin:10px auto 0;text-align:left;border-top:1px solid var(--line);padding-top:14px;line-height:2">';
h+='<a class="back-link" href="prog_01_moves.html">01 \u00b7 Ownership: Read, Mutate, Move</a><br>';
h+='<a class="back-link" href="prog_02_stats.html">02 \u00b7 Mean, Variance &amp; Deviation</a><br>';
h+='<a class="back-link" href="prog_03_dms.html">03 \u00b7 Degrees, Minutes, Seconds</a><br>';
h+='<a class="back-link" href="prog_04_compound.html">04 \u00b7 Compound Growth &amp; Effective Rates</a><br>';
h+='<a class="back-link" href="prog_05_structs.html">05 \u00b7 Structs, Traits &amp; Fieldwise Init</a><br>';
h+='<a class="back-link" href="prog_06_simd.html">06 \u00b7 SIMD Vector Arithmetic</a><br>';
h+='<a class="back-link" href="prog_07_regression.html">07 \u00b7 Covariance &amp; the Regression Line</a><br>';
h+='<a class="back-link" href="prog_08_npv.html">08 \u00b7 Discounting, NPV &amp; the Annuity</a><br>';
h+='<a class="back-link" href="prog_09_bearing.html">09 \u00b7 Planar Distance &amp; Bearing</a><br>';
h+='<a class="back-link" href="prog_10_queues.html">10 \u00b7 Little&rsquo;s Law &amp; Queues</a><br>';
h+='<a class="back-link" href="prog_11_amort.html">11 \u00b7 Amortisation &amp; the Level Payment</a><br>';
h+='<a class="back-link" href="prog_12_ecef.html">12 \u00b7 Geodetic&nbsp;\u2194&nbsp;ECEF</a><br>';
h+='<a class="back-link" href="prog_13_simplex.html">13 \u00b7 Simplex over the Feasible Region</a>';
h+='</div>';
h+='<span class="reset-link" id="resetAll">Reset all progress</span>';
h+='</div>';
h+='</div>';

app.innerHTML=h;
document.getElementById('resetAll').addEventListener('click',function(){
if(confirm('Reset all progress across all four chapters?')){
store=fresh();save();renderHome();
}
});
}

function renderChapter(ci){
var ch=CHAPTERS[ci];
var cleared=chCleared(ch.key,ch.levels);
var total=ch.levels.length;
var pct=total>0?Math.round(cleared/total*100):0;

var h='';
h+='<div class="view">';
h+='<div class="chapter-head">';
h+='<div class="ch-head-inner">';
h+='<a class="back-link" href="#/home">\u2190 chapters</a>';
h+='<a class="back-link" href="../index.html" style="margin-left:12px">Praxis \u2197</a>';
h+='<div class="ch-head-title">';
h+='<div class="hk">Chapter '+ch.num+'</div>';
h+='<div class="ht">'+ch.title+'</div>';
h+='</div>';
h+='<div class="progress-area">';
h+='<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>';
h+='<span class="progress-label"><b>'+cleared+'</b> / '+total+'</span>';
h+='<button class="btn btn-sm btn-ghost" id="resetCh" title="Reset this chapter">reset</button>';
h+='</div>';
h+='</div>';
h+='</div>';

h+='<div class="chapter-body">';
h+='<div class="chapter-lede">';
h+='<h1><em>'+ch.title+'</em></h1>';
h+='<p>'+ch.lede+'</p>';
h+='</div>';
h+='<div class="levels" id="levels">';
ch.levels.forEach(function(lv,i){
var st=levelStatus(ch.key,ch.levels,i);
h+=renderLevel(ch,ci,lv,i,st);
});
h+='</div>';
if(cleared>=total){
h+='<div class="finish">';
h+='<h3>Chapter '+ch.num+' cleared</h3>';
h+='<p>'+cleared+' of '+total+' drills studied.</p>';
if(ci<CHAPTERS.length-1){
var nx=CHAPTERS[ci+1];
h+='<a class="btn btn-primary" href="#/ch/'+(ci+2)+'">Next: Chapter '+nx.num+' \u2014 '+nx.title+' \u2192</a>';
} else {
h+='<a class="btn btn-primary" href="#/home">Back to all chapters</a>';
}
h+='</div>';
}
if(ci<CHAPTERS.length-1||ci>0){
h+='<div class="ch-nav">';
if(ci>0){var pv=CHAPTERS[ci-1];h+='<a class="btn btn-ghost btn-sm" href="#/ch/'+ci+'">\u2190 Chapter '+pv.num+': '+pv.title+'</a>';} else {h+='<span></span>';}
if(ci<CHAPTERS.length-1){var nx2=CHAPTERS[ci+1];h+='<a class="btn btn-ghost btn-sm" href="#/ch/'+(ci+2)+'">Chapter '+nx2.num+': '+nx2.title+' \u2192</a>';} else {h+='<span></span>';}
h+='</div>';
}
h+='</div>';
h+='</div>';

app.innerHTML=h;

var resetBtn=document.getElementById('resetCh');
if(resetBtn){
resetBtn.addEventListener('click',function(){
if(confirm('Reset all levels in Chapter '+ch.num+'?')){
ch.levels.forEach(function(_,i){
delete store.solved[ch.key+':'+i];
delete store.revealed[ch.key+':'+i];
});
save();
renderChapter(ci);
}
});
}

ch.levels.forEach(function(lv,i){
var st=levelStatus(ch.key,ch.levels,i);
if(st==='active'){
if(lv.type==='choice'){
var opts=document.querySelectorAll('.level-card[data-i="'+i+'"] .opt');
opts.forEach(function(optBtn){
optBtn.addEventListener('click',function(){
handleChoice(ci,i,parseInt(optBtn.dataset.j));
});
});
} else {
var ta=document.querySelector('.level-card[data-i="'+i+'"] textarea.ans');
if(ta){
ta.addEventListener('keydown',function(e){
if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){
e.preventDefault();
handleTextCheck(ci,i);
}
});
}
var checkBtn=document.querySelector('.level-card[data-i="'+i+'"] .check-btn');
if(checkBtn) checkBtn.addEventListener('click',function(){handleTextCheck(ci,i);});
}
}
var hintBtn=document.querySelector('.level-card[data-i="'+i+'"] .hint-toggle');
if(hintBtn) hintBtn.addEventListener('click',function(){
var box=document.querySelector('.level-card[data-i="'+i+'"] .hint-box');
if(box) box.classList.toggle('show');
});
var solBtn=document.querySelector('.level-card[data-i="'+i+'"] .sol-toggle');
if(solBtn) solBtn.addEventListener('click',function(){
var box=document.querySelector('.level-card[data-i="'+i+'"] .solution-box');
if(box) box.classList.add('show');
});
});
}

function renderLevel(ch,ci,lv,i,st){
var style=(ch.nest&&i>0)?' style="margin-left:'+Math.min(i*8,40)+'px"':'';
var h='<div class="level-card '+st+'" data-i="'+i+'"'+style+'>';
h+='<div class="level-head">';
h+='<div><div class="level-num">LEVEL '+(i+1)+' \u00b7 OF '+ch.levels.length+'</div>';
h+='<div class="level-title">'+lv.title+'</div></div>';
h+='<div class="level-tags">';
h+='<span class="tag">'+lv.tag+'</span>';
if(st==='active') h+='<span class="pill pill-active">in progress</span>';
else if(st==='solved') h+='<span class="pill pill-solved">\u2713 solved</span>';
else if(st==='revealed') h+='<span class="pill pill-revealed">solution seen</span>';
else h+='<span class="pill pill-locked">locked</span>';
h+='</div></div>';

if(st==='locked'){
h+='<div class="lock-note">Clear the level above to unlock this one.</div></div>';
return h;
}

h+='<div class="level-body">';
h+='<p class="prompt">'+lv.prompt+'</p>';
h+='<pre class="code">'+hl(lv.code)+'</pre>';

if(st==='active'){
if(lv.type==='choice'){
h+='<div class="options">';
var letters='ABCD';
lv.options.forEach(function(opt,j){
h+='<button class="opt" data-j="'+j+'"><span class="opt-letter">'+letters[j]+'</span><span>'+opt+'</span></button>';
});
h+='</div>';
} else {
h+='<label class="field-label">your prediction \u2014 one line per print ('+('ontouchstart' in window?'tap':'Ctrl+Enter')+' to check)</label>';
h+='<textarea class="ans" placeholder="type each printed line, in order..." rows="3"></textarea>';
}
h+='<div class="controls">';
if(lv.type!=='choice') h+='<button class="btn btn-primary check-btn">Check answer</button>';
h+='<button class="btn btn-ghost btn-sm hint-toggle">Hint</button>';
h+='<button class="btn btn-ghost btn-sm sol-toggle">Show solution</button>';
h+='</div>';
h+='<div class="fb" id="fb-'+i+'"></div>';
h+='<div class="hint-box" id="hb-'+i+'">'+lv.hint+'</div>';
h+='<div class="solution-box" id="sb-'+i+'">'+solutionHTML(lv)+'</div>';
} else {
h+='<div class="solution-box show">'+solutionHTML(lv)+'</div>';
}
h+='</div></div>';
return h;
}

function solutionHTML(lv){
var h='<div class="sol-label">solution &amp; why</div>';
if(lv.solutionCode) h+='<pre class="code">'+hl(lv.solutionCode)+'</pre>';
h+='<div class="explain">'+lv.explain+'</div>';
return h;
}

function showFB(ci,i,cls,msg){
var fb=document.querySelector('.level-card[data-i="'+i+'"] .fb');
if(!fb)return;
fb.className='fb show '+cls;
fb.innerHTML=msg;
}
function handleTextCheck(ci,i){
var ch=CHAPTERS[ci];
var lv=ch.levels[i];
var ta=document.querySelector('.level-card[data-i="'+i+'"] textarea.ans');
if(!ta)return;
var val=ta.value;
if(!val.trim()){
showFB(ci,i,'fb-no','Write your prediction first \u2014 one line per <code>print</code>.');
return;
}
var ok=false;
if(lv.accept){
ok=lv.accept(norm(val));
} else {
ok=norm(val)===norm(lv.expected.join('\n'));
}
if(ok){
showFB(ci,i,'fb-ok',cmsgs[i%cmsgs.length]+' \u2014 <b>solved</b>.');
solve(ch.key,i);
ta.disabled=true;
var cb=document.querySelector('.level-card[data-i="'+i+'"] .check-btn');
if(cb) cb.disabled=true;
var sb=document.querySelector('.level-card[data-i="'+i+'"] .solution-box');
if(sb) sb.classList.add('show');
setTimeout(function(){renderChapter(ci);},800);
} else {
var a=incAttempts(ch.key,i);
var msg=qmsgs[i%qmsgs.length];
if(a>=2) msg+=' Hint unlocked below \u2193';
showFB(ci,i,'fb-no',msg);
if(a>=2){
var hb=document.querySelector('.level-card[data-i="'+i+'"] .hint-box');
if(hb) hb.classList.add('show');
}
}
}

function handleChoice(ci,i,j){
var ch=CHAPTERS[ci];
var lv=ch.levels[i];
var opts=document.querySelectorAll('.level-card[data-i="'+i+'"] .opt');
if(!opts.length)return;
if(opts[0].disabled)return;

if(j===lv.correct){
opts[j].classList.add('opt-correct');
opts.forEach(function(o){o.disabled=true;});
solve(ch.key,i);
showFB(ci,i,'fb-ok',cmsgs[i%cmsgs.length]);
var sb=document.querySelector('.level-card[data-i="'+i+'"] .solution-box');
if(sb) sb.classList.add('show');
setTimeout(function(){renderChapter(ci);},800);
} else {
opts[j].classList.add('opt-wrong');
opts[j].disabled=true;
var a=incAttempts(ch.key,i);
var msg=qmsgs[i%qmsgs.length];
if(a>=2) msg+=' Hint unlocked below \u2193';
showFB(ci,i,'fb-no',msg);
if(a>=2){
var hb=document.querySelector('.level-card[data-i="'+i+'"] .hint-box');
if(hb) hb.classList.add('show');
}
}
}

function route(){
var h=location.hash||'#/home';
var m=h.match(/^#\/ch\/(\d+)$/);
if(m){
var ci=parseInt(m[1])-1;
if(ci>=0&&ci<CHAPTERS.length) renderChapter(ci);
else renderHome();
} else {
renderHome();
}
}

window.addEventListener('hashchange',route);
route();

})();
</script>
